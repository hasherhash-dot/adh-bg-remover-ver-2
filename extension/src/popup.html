<!doctype html>
<html lang="en" class="popup-document"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>ADH Background Remover</title><link rel="stylesheet" href="ui.css"/></head>
<body class="popup-document"><main class="popup">
 <header class="header"><img class="brand-logo" src="assets/adh-logo.svg" alt="American Design Hub" draggable="false"/><button id="open-options" class="btn btn-ghost spacer" type="button">Settings ↗</button></header>
 <section class="popup-intro"><p class="eyebrow">YOUR POCKET PHOTO STUDIO</p><h1>Backgrounds off.<br/><em>Creativity on.</em></h1><p class="muted">A fresh start for the image in front of you.</p></section>
 <input id="file-input" type="file" accept="image/*" multiple hidden/>
 <button id="dropzone" class="dropzone" type="button"><span class="upload-icon" aria-hidden>↥</span><strong>Upload your image</strong><span class="muted">Drop a file here, or click to browse</span><span class="subtle">JPG · PNG · WEBP · HEIC · up to 25MB</span></button>
 <div id="status" class="status hidden" role="status" aria-live="polite"><span class="spinner" id="status-spinner"></span><span id="status-text">Removing background…</span></div>
 <section class="section recent-section"><div class="section-heading"><h2 class="section-title">Recent cut-outs</h2><span class="subtle">On this browser</span></div><div id="recents" class="recents"></div><p id="recents-empty" class="empty-history">No cut-outs yet. You can also right-click a webpage image and choose <strong>Remove background</strong>.</p></section>
 <footer class="popup-footer"><button id="open-web-app" class="btn btn-block">Open the full studio <span aria-hidden>↗</span></button><p class="subtle">AMERICAN DESIGN HUB / BACKGROUND REMOVER</p></footer>
</main><script type="module" src="popup.js"></script></body></html>
